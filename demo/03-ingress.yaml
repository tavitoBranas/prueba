apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: default
  name: ingress-demo
  annotations:
    # ALB publico, creado por el AWS Load Balancer Controller
    alb.ingress.kubernetes.io/scheme: internet-facing
    # El ALB enruta directo a las IPs de los pods (Service ClusterIP)
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service
                port:
                  number: 80
