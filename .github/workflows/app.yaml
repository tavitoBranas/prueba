name: App CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - 'app/**'
      - 'k8s/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: web-app
  EKS_CLUSTER: demo-eks
  K8S_NAMESPACE: web-app
  K8S_DEPLOYMENT: web-app
  CONTAINER_NAME: web-app

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Build y push a ECR
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag y push de imagen
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPO:$IMAGE_TAG"

          docker build \
            --label "git.sha=${{ github.sha }}" \
            --label "git.branch=${{ github.ref_name }}" \
            --label "build.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE_URI" \
            -t "$REGISTRY/$ECR_REPO:latest" \
            ./app

          docker push "$IMAGE_URI"
          docker push "$REGISTRY/$ECR_REPO:latest"

          # Exportar URI de imagen para el siguiente job
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────
  # JOB 2: Deploy en EKS
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Aplicar manifiestos con la nueva imagen
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          # Solo se sustituye ${IMAGE_URI}; el resto del YAML queda intacto
          for f in k8s/*.yaml; do
            envsubst '${IMAGE_URI}' < "$f"
            echo "---"
          done | kubectl apply -f -

      - name: Esperar el rollout
        run: |
          kubectl rollout status deployment/"$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            --timeout=180s

      - name: Mostrar estado
        if: always()
        run: |
          kubectl get deploy,pods,svc,ingress -n "$K8S_NAMESPACE" -o wide
